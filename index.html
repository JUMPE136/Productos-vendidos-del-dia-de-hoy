<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas e Inventario</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #000000; color: #ffffff; padding-bottom: 40px; }

        /* Pantalla PIN */
        #pantalla-pin {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .pin-box { background-color: #1a1a1a; border: 2px solid #3b82f6; padding: 30px; border-radius: 12px; text-align: center; max-width: 350px; width: 100%; }
        .pin-input { width: 100%; padding: 12px; font-size: 1.5rem; text-align: center; letter-spacing: 8px; border-radius: 6px; border: 1px solid #82b1ff; background-color: #000; color: #fff; margin: 15px 0; }
        .pin-btn { background-color: #3b82f6; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Header / Nav superior responsivo */
        header { 
            background-color: #3b82f6; 
            padding: 8px 10px; 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .nav-btn { 
            flex: 1; 
            background-color: #82b1ff; 
            color: #000000; 
            border: none; 
            padding: 8px 4px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            text-align: center; 
            white-space: nowrap; 
        }

        /* Contenedor Principal */
        .container { max-width: 650px; margin: 15px auto; padding: 0 10px; }

        /* Ruta de Navegación / Breadcrumb */
        .breadcrumb-bar { background-color: #1c1c1c; padding: 10px 15px; border-radius: 8px; margin-bottom: 12px; font-size: 0.9rem; color: #ffffff; font-weight: bold; }
        .breadcrumb-highlight { color: #82b1ff; cursor: pointer; }

        /* Buscador */
        .search-box { position: relative; margin-bottom: 12px; }
        .search-input { width: 100%; padding: 10px 12px 10px 35px; border-radius: 8px; border: none; background-color: #ffffff; color: #000000; font-size: 0.95rem; }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #666; font-size: 0.9rem; }

        /* Botones de Acción */
        .actions-group { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
        .action-btn { flex: 1 1 calc(50% - 6px); min-width: 110px; border: none; padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 0.7rem; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 4px; text-align: center; }
        
        .btn-add { background-color: #82b1ff; color: #000000; }
        .btn-edit { background-color: #ffc107; color: #000000; }
        .btn-move { background-color: #17a2b8; color: #ffffff; }
        .btn-delete { background-color: #dc3545; color: #ffffff; }
        .action-btn.active-mode { background-color: #fd7e14; color: #ffffff; }

        /* Vistas y Grilla de 3 Columnas */
        .view { display: none; }
        .view.active { display: block; }
        
        .grid-cards { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 COLUMNAS EXACTAS */
            gap: 8px; 
        }

        .card-product { 
            background-color: #82b1ff; 
            color: #000000; 
            border-radius: 10px; 
            padding: 12px 6px; 
            text-align: center; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 0.8rem; 
            line-height: 1.15;
            min-height: 90px;
            word-break: break-word;
        }
        .card-icon { font-size: 1.4rem; margin-bottom: 5px; }

        .modo-eliminar .card-product { border: 2px dashed #dc3545; background-color: #f8d7da; color: #842029; }
        .modo-editar .card-product { border: 2px dashed #ffc107; background-color: #fff3cd; color: #664d03; }
        .modo-mover .card-product { border: 2px dashed #17a2b8; background-color: #d1ecf1; color: #0c5460; }

        /* Estilos Carrito e Historial */
        .title-sec { text-align: center; font-size: 1.1rem; margin-bottom: 5px; color: #fff; font-weight: bold; }
        .date-sec { text-align: center; font-size: 0.9rem; color: #82b1ff; margin-bottom: 20px; }
        .total-sec { text-align: center; font-size: 1.1rem; color: #82b1ff; font-weight: bold; margin-top: 6px; margin-bottom: 15px; background: #1a1a1a; padding: 8px; border-radius: 6px; border: 1px solid #3b82f6; }
        
        .list-row { background-color: #82b1ff; color: #000; border-radius: 10px; padding: 12px 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .prod-name { font-size: 0.95rem; flex: 1; text-align: left; }
        .controls { display: flex; align-items: center; gap: 8px; }
        .btn-circle { width: 32px; height: 32px; border-radius: 50%; border: none; color: #fff; font-weight: bold; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-icon { background-color: #000; color: #fff; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
        .btn-minus { background-color: #dc3545; }
        .btn-plus { background-color: #28a745; }
        .btn-save-day { background-color: #28a745; color: #fff; width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; margin-top: 15px; cursor: pointer; }

        /* Modales */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background-color: #1a1a1a; border: 2px solid #82b1ff; border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; text-align: center; }

        .color-row { background-color: #2a2a2a; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #444; }
        .color-info { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; }
        .color-actions { display: flex; justify-content: space-between; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: #28a745; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; z-index: 1000; }
        .sync-badge { font-size: 0.7rem; background: #28a745; color: white; padding: 2px 6px; border-radius: 10px; margin-left: 2px; display: inline-block; }
    </style>
</head>
<body>

    <!-- PIN -->
    <div id="pantalla-pin">
        <div class="pin-box">
            <h3>🔒 ACCESO AL NEGOCIO</h3>
            <p style="font-size: 0.85rem; color: #82b1ff; margin-top: 5px;">Ingresa el PIN de 4 dígitos</p>
            <input type="password" id="input-pin" class="pin-input" maxlength="4" placeholder="••••">
            <button class="pin-btn" onclick="verificarPin()">INGRESAR</button>
            <div id="error-pin" style="color: #dc3545; font-size: 0.85rem; margin-top: 10px; display: none;">PIN incorrecto</div>
        </div>
    </div>

    <!-- Navegación Ajustada para Celular -->
    <header>
        <button class="nav-btn" onclick="irInicio()">INICIO <span id="status-sync" class="sync-badge">☁️</span></button>
        <button class="nav-btn" onclick="verPantalla('pantalla-carrito-hoy')">CARRITO HOY</button>
        <button class="nav-btn" onclick="verPantalla('pantalla-historial')">HISTORIAL</button>
    </header>

    <div class="container">

        <div id="breadcrumb" class="breadcrumb-bar" style="display: none;">
            📁 <span class="breadcrumb-highlight" onclick="irInicio()">Inicio</span>
            <span id="bc-cat-wrapper" style="display:none;"> > <span id="bc-cat-name"></span></span>
        </div>

        <!-- 1. CATEGORÍAS PRINCIPALES -->
        <div id="pantalla-categorias" class="view active">
            <div class="search-box">
                <span class="search-icon">🔎</span>
                <input type="text" class="search-input" id="search-cat" placeholder="Buscar Categoría..." oninput="filtrarCards('contenedor-categorias', this.value)">
            </div>
            
            <div class="actions-group">
                <button class="action-btn btn-add" onclick="agregarNuevaCategoria()">+ AGREGAR CATEGORÍA</button>
                <button class="action-btn btn-edit" id="btn-edit-cat" onclick="toggleModo('Cat', 'editar')">✏️ EDITAR</button>
                <button class="action-btn btn-delete" id="btn-del-cat" onclick="toggleModo('Cat', 'eliminar')">🗑️ ELIMINAR</button>
            </div>

            <div class="grid-cards" id="contenedor-categorias"></div>
        </div>

        <!-- 2. PRODUCTOS/SUBCATEGORÍAS -->
        <div id="pantalla-productos" class="view">
            <div class="search-box">
                <span class="search-icon">🔑</span>
                <input type="text" class="search-input" id="search-prod" placeholder="Buscar Producto..." oninput="filtrarCards('contenedor-productos', this.value)">
            </div>
            
            <div class="actions-group">
                <button class="action-btn btn-add" onclick="agregarNuevoProducto()">+ AGREGAR PRODUCTO</button>
                <button class="action-btn btn-edit" id="btn-edit-prod" onclick="toggleModo('Prod', 'editar')">✏️ EDITAR</button>
                <button class="action-btn btn-move" id="btn-mov-prod" onclick="toggleModo('Prod', 'mover')">↔️ MOVER PRODUCTO</button>
                <button class="action-btn btn-delete" id="btn-del-prod" onclick="toggleModo('Prod', 'eliminar')">🗑️ ELIMINAR</button>
            </div>

            <div class="grid-cards" id="contenedor-productos"></div>
        </div>

        <!-- 3. CARRITO HOY -->
        <div id="pantalla-carrito-hoy" class="view">
            <div class="title-sec">LISTADO DE PRODUCTOS VENDIDOS HOY</div>
            <div class="date-sec" id="fecha-actual">FECHA - --/--/----</div>
            <div id="contenedor-carrito-hoy"></div>
            <button class="btn-save-day" onclick="guardarDiaEnHistorial()">💾 GUARDAR DÍA EN HISTORIAL</button>
        </div>

        <!-- 4. HISTORIAL -->
        <div id="pantalla-historial" class="view">
            <div class="title-sec">HISTORIAL DE VENTAS POR FECHA</div>
            <div class="actions-group" style="margin-top: 15px;">
                <button class="action-btn btn-delete" id="btn-del-hist" onclick="toggleModo('Hist', 'eliminar')" style="width: 100%;">🗑️ ELIMINAR REGISTRO DÍA COMPLETO</button>
            </div>
            <div id="contenedor-historial-fechas"></div>
        </div>

    </div>

    <!-- PANTALLITA FLOTANTE (MODAL) PARA SELECCIONAR / EDITAR COLORES -->
    <div class="modal" id="modal-colores">
        <div class="modal-content">
            <h3 id="modal-prod-nombre" style="color: #82b1ff; font-size: 1.3rem;">Producto</h3>
            <p style="font-size: 0.9rem; margin: 8px 0 15px 0; color: #ccc; font-weight: bold;">Color:</p>
            
            <div id="lista-colores-modal"></div>

            <button class="action-btn btn-add" style="background:#28a745; color:#fff; width:100%; margin-top:10px; padding:10px;" onclick="agregarNuevoColorVariante()">+ AGREGAR COLOR/VARIANTE</button>
            <button class="btn-save-day" style="background-color: #dc3545; padding: 10px; margin-top:10px;" onclick="cerrarModalColores()">CERRAR</button>
        </div>
    </div>

    <!-- Modal Historial Detalle -->
    <div class="modal" id="modal-historial">
        <div class="modal-content">
            <div class="title-sec" id="modal-titulo-fecha">VENTAS: --/--/----</div>
            <div class="total-sec" id="modal-total-dia">TOTAL VENDIDO: $0</div>
            
            <div id="modal-lista-productos" style="margin: 15px 0;"></div>
            
            <button class="btn-save-day" style="background-color: #28a745;" onclick="agregarProductoFaltanteHistorial()">+ AGREGAR FALTANTE</button>
            <button class="btn-save-day" style="background-color: #dc3545; margin-top: 10px;" onclick="cerrarModalHistorial()">CERRAR</button>
        </div>
    </div>

    <div class="toast" id="toast">✅ Vendido y descontado de stock</div>

    <!-- SCRIPT FIREBASE Y LÓGICA DE NEGOCIO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDif7CYhHMB-gfOl5mEaflTOmKyfWjvbmY",
            authDomain: "paguina-inventario.firebaseapp.com",
            projectId: "paguina-inventario",
            storageBucket: "paguina-inventario.firebasestorage.app",
            messagingSenderId: "249088242563",
            appId: "1:249088242563:web:d7cd67d47e0ba9f01b7cb6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "inventario", "datos_globales");

        // Datos en memoria
        window.datos = {
            categorias: [
                { id: 'cat_bolsas', nombre: 'Bolsas' },
                { id: 'cat_jabones', nombre: 'Jabones' }
            ],
            productos: [
                { 
                    id: 'p1', 
                    catId: 'cat_bolsas', 
                    nombre: 'Bolsa manija 1.5kg',
                    precioBase: 1200,
                    variantes: [
                        { color: 'Blanca', stock: 100, precio: 1200 }
                    ]
                }
            ],
            carritoHoy: {},
            historialFechas: []
        };

        // Escuchar cambios en tiempo real desde Firebase
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                window.datos = docSnap.data();
                document.getElementById('status-sync').innerText = '☁️';
                document.getElementById('status-sync').style.background = '#28a745';
                
                const vistaActiva = document.querySelector('.view.active').id;
                if (vistaActiva === 'pantalla-categorias') renderCategorias();
                if (vistaActiva === 'pantalla-productos') renderProductos();
                if (vistaActiva === 'pantalla-carrito-hoy') renderCarritoHoy();
                if (vistaActiva === 'pantalla-historial') renderHistorial();
                if (window.productoActualModal) {
                    const prodActualizado = window.datos.productos.find(p => p.id === window.productoActualModal.id);
                    if (prodActualizado) {
                        window.productoActualModal = prodActualizado;
                        renderVariantesModal();
                    }
                }
            } else {
                window.guardarBD();
            }
        });

        // Guardar en Firebase
        window.guardarBD = async function() {
            try {
                document.getElementById('status-sync').innerText = '⏳';
                document.getElementById('status-sync').style.background = '#ffc107';
                await setDoc(docRef, window.datos);
            } catch (error) {
                console.error("Error guardando en Firebase: ", error);
                document.getElementById('status-sync').innerText = '⚠️';
                document.getElementById('status-sync').style.background = '#dc3545';
            }
        };
    </script>

    <script>
        const PIN_SECRETO = '1027';

        let modos = {
            Cat: { editar: false, eliminar: false },
            Prod: { editar: false, eliminar: false, mover: false },
            Hist: { eliminar: false }
        };

        function comprobarSesionPin() {
            if (localStorage.getItem('app_sesion_pin') === new Date().toDateString()) {
                document.getElementById('pantalla-pin').style.display = 'none';
            } else {
                document.getElementById('pantalla-pin').style.display = 'flex';
            }
        }

        function verificarPin() {
            if (document.getElementById('input-pin').value === PIN_SECRETO) {
                localStorage.setItem('app_sesion_pin', new Date().toDateString());
                document.getElementById('pantalla-pin').style.display = 'none';
                document.getElementById('error-pin').style.display = 'none';
                document.getElementById('input-pin').value = '';
            } else {
                document.getElementById('error-pin').style.display = 'block';
            }
        }

        comprobarSesionPin();

        const hoy = new Date();
        const strFecha = `${hoy.getDate().toString().padStart(2, '0')}/${(hoy.getMonth() + 1).toString().padStart(2, '0')}/${hoy.getFullYear()}`;
        document.getElementById('fecha-actual').innerText = `FECHA - ${strFecha}`;

        let catSeleccionada = null;
        let productoActualModal = null;
        let historialIndexActual = null;

        function verPantalla(pantallaId) {
            desactivarTodosModos();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(pantallaId).classList.add('active');

            const bc = document.getElementById('breadcrumb');
            if (pantallaId === 'pantalla-categorias') {
                bc.style.display = 'none';
                renderCategorias();
            } else if (pantallaId === 'pantalla-productos') {
                bc.style.display = 'block';
                document.getElementById('bc-cat-wrapper').style.display = 'inline';
                renderProductos();
            } else {
                bc.style.display = 'none';
            }

            if (pantallaId === 'pantalla-carrito-hoy') renderCarritoHoy();
            if (pantallaId === 'pantalla-historial') renderHistorial();
        }

        function irInicio() {
            catSeleccionada = null;
            verPantalla('pantalla-categorias');
        }

        function desactivarTodosModos() {
            for (let sec in modos) {
                for (let acc in modos[sec]) {
                    modos[sec][acc] = false;
                }
            }
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active-mode'));
            document.querySelectorAll('.grid-cards, #contenedor-historial-fechas').forEach(g => {
                g.classList.remove('modo-eliminar', 'modo-editar', 'modo-mover');
            });
            document.getElementById('btn-edit-cat').innerText = '✏️ EDITAR';
            document.getElementById('btn-del-cat').innerText = '🗑️ ELIMINAR';
            document.getElementById('btn-edit-prod').innerText = '✏️ EDITAR';
            document.getElementById('btn-mov-prod').innerText = '↔️ MOVER PRODUCTO';
            document.getElementById('btn-del-prod').innerText = '🗑️ ELIMINAR';
            document.getElementById('btn-del-hist').innerText = '🗑️ ELIMINAR REGISTRO DÍA COMPLETO';
        }

        function toggleModo(seccion, accion) {
            const estadoActual = modos[seccion][accion];
            desactivarTodosModos();
            modos[seccion][accion] = !estadoActual;

            if (modos[seccion][accion]) {
                const btnId = `btn-${accion.substring(0,3)}-${seccion.toLowerCase()}`;
                const btn = document.getElementById(btnId);
                if (btn) {
                    btn.classList.add('active-mode');
                    btn.innerText = '❌ CANCELAR';
                }

                let contId = `contenedor-${seccion === 'Cat' ? 'categorias' : 'productos'}`;
                if (seccion === 'Hist') contId = 'contenedor-historial-fechas';
                document.getElementById(contId).classList.add(`modo-${accion}`);
            }

            if (seccion === 'Cat') renderCategorias();
            if (seccion === 'Prod') renderProductos();
            if (seccion === 'Hist') renderHistorial();
        }

        // --- 1. CATEGORÍAS ---
        function renderCategorias() {
            const cont = document.getElementById('contenedor-categorias');
            cont.innerHTML = '';

            window.datos.categorias.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'card-product';
                card.innerHTML = `<div class="card-icon">📁</div><div>${cat.nombre}</div>`;
                card.onclick = () => {
                    if (modos.Cat.eliminar) {
                        if (confirm(`¿Eliminar categoría "${cat.nombre}" y sus productos?`)) {
                            window.datos.categorias = window.datos.categorias.filter(c => c.id !== cat.id);
                            window.datos.productos = window.datos.productos.filter(p => p.catId !== cat.id);
                            window.guardarBD();
                            desactivarTodosModos();
                            renderCategorias();
                        }
                    } else if (modos.Cat.editar) {
                        const n = prompt('Nuevo nombre:', cat.nombre);
                        if (n && n.trim() !== '') {
                            cat.nombre = n.trim();
                            window.guardarBD();
                            desactivarTodosModos();
                            renderCategorias();
                        }
                    } else {
                        catSeleccionada = cat.id;
                        document.getElementById('bc-cat-name').innerText = cat.nombre;
                        verPantalla('pantalla-productos');
                    }
                };
                cont.appendChild(card);
            });
        }

        function agregarNuevaCategoria() {
            const nombre = prompt('Nombre de la nueva categoría:');
            if (nombre && nombre.trim() !== '') {
                window.datos.categorias.push({ id: 'cat_' + Date.now(), nombre: nombre.trim() });
                window.guardarBD();
                renderCategorias();
            }
        }

        // --- 2. PRODUCTOS ---
        function renderProductos() {
            const cont = document.getElementById('contenedor-productos');
            cont.innerHTML = '';

            let prods = window.datos.productos.filter(p => p.catId === catSeleccionada);

            prods.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card-product';
                
                card.innerHTML = `
                    <div class="card-icon">📦</div>
                    <div>${p.nombre}</div>
                `;

                card.onclick = () => {
                    if (modos.Prod.eliminar) {
                        if (confirm(`¿Eliminar producto "${p.nombre}"?`)) {
                            window.datos.productos = window.datos.productos.filter(item => item.id !== p.id);
                            window.guardarBD();
                            desactivarTodosModos();
                            renderProductos();
                        }
                    } else if (modos.Prod.editar) {
                        const n = prompt('Nuevo nombre del producto:', p.nombre);
                        if (n && n.trim() !== '') {
                            p.nombre = n.trim();
                            window.guardarBD();
                            desactivarTodosModos();
                            renderProductos();
                        }
                    } else if (modos.Prod.mover) {
                        moverProductoOpcion(p);
                    } else {
                        abrirModalColores(p);
                    }
                };
                cont.appendChild(card);
            });
        }

        function moverProductoOpcion(producto) {
            let opciones = 'Selecciona el número de la categoría destino:\n\n';
            const categoriasDisponibles = window.datos.categorias.filter(c => c.id !== catSeleccionada);

            if (categoriasDisponibles.length === 0) {
                alert('No hay otras categorías disponibles a las cuales mover.');
                return;
            }

            categoriasDisponibles.forEach((c, index) => {
                opciones += `${index + 1}. ${c.nombre}\n`;
            });

            const elegida = prompt(opciones);
            const num = parseInt(elegida, 10);

            if (!isNaN(num) && num >= 1 && num <= categoriasDisponibles.length) {
                producto.catId = categoriasDisponibles[num - 1].id;
                window.guardarBD();
                alert(`Producto movido a "${categoriasDisponibles[num - 1].nombre}"`);
                desactivarTodosModos();
                renderProductos();
            }
        }

        function agregarNuevoProducto() {
            const nombre = prompt('Nombre del nuevo producto:');
            if (nombre && nombre.trim() !== '' && catSeleccionada) {
                const precio = parseInt(prompt('Precio base del producto:', '1200'), 10) || 0;
                window.datos.productos.push({
                    id: 'p_' + Date.now(),
                    catId: catSeleccionada,
                    nombre: nombre.trim(),
                    precioBase: precio,
                    variantes: [
                        { color: 'Estándar', stock: 0, precio: precio }
                    ]
                });
                window.guardarBD();
                renderProductos();
            }
        }

        // --- 3. MODAL VARIANTES ---
        function abrirModalColores(producto) {
            productoActualModal = producto;
            window.productoActualModal = producto;
            document.getElementById('modal-prod-nombre').innerText = producto.nombre;
            renderVariantesModal();
            document.getElementById('modal-colores').style.display = 'flex';
        }

        function renderVariantesModal() {
            const cont = document.getElementById('lista-colores-modal');
            cont.innerHTML = '';

            if (!productoActualModal.variantes || productoActualModal.variantes.length === 0) {
                cont.innerHTML = '<div style="color:#aaa;">No hay colores registrados.</div>';
                return;
            }

            productoActualModal.variantes.forEach((v, index) => {
                const box = document.createElement('div');
                box.className = 'color-row';
                box.innerHTML = `
                    <div class="color-info">
                        <span>${v.color}</span>
                        <span style="color:#82b1ff;">$${(v.precio || 0).toLocaleString('es-CO')}</span>
                    </div>
                    <div class="color-info" style="font-size:0.85rem; color:#aaa;">
                        <span>Stock disponible: <strong>${v.stock}</strong></span>
                        <button class="nav-btn" style="background:#28a745; color:#fff;" onclick="venderColor('${v.color}', ${v.precio})">🛒 VENDER</button>
                    </div>
                    <div class="color-actions">
                        <button class="btn-icon" style="background:#28a745;" onclick="modificarStockVariante(${index})">✏️ Stock</button>
                        <button class="btn-icon" style="background:#ffc107; color:#000;" onclick="editarPrecioVariante(${index})">✏️ Precio</button>
                        <button class="btn-icon" style="background:#17a2b8;" onclick="editarNombreVariante(${index})">✏️ Nombre del producto</button>
                        <button class="btn-icon" style="background:#dc3545;" onclick="eliminarVariante(${index})">🗑️</button>
                    </div>
                `;
                cont.appendChild(box);
            });
        }

        function venderColor(colorNombre, precio) {
            const variante = productoActualModal.variantes.find(v => v.color === colorNombre);
            if (variante) {
                if (variante.stock <= 0) {
                    alert('Este producto ya no hay en stock');
                    return;
                }
                
                variante.stock -= 1;
                const nombreCompleto = `${productoActualModal.nombre} (${colorNombre})`;

                if (window.datos.carritoHoy[nombreCompleto]) {
                    window.datos.carritoHoy[nombreCompleto].cantidad += 1;
                } else {
                    window.datos.carritoHoy[nombreCompleto] = { cantidad: 1, precio: precio };
                }

                window.guardarBD();
                renderVariantesModal();
                renderProductos();

                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 1000);
            }
        }

        function modificarStockVariante(index) {
            const v = productoActualModal.variantes[index];
            const nuevoStock = prompt(`Ajustar stock de ${v.color} (Actual: ${v.stock}):`, v.stock);
            if (nuevoStock !== null) {
                const val = parseInt(nuevoStock, 10);
                if (!isNaN(val)) {
                    v.stock = val;
                    window.guardarBD();
                    renderVariantesModal();
                    renderProductos();
                }
            }
        }

        function editarPrecioVariante(index) {
            const v = productoActualModal.variantes[index];
            const p = prompt(`Nuevo precio para ${v.color}:`, v.precio);
            if (p !== null) {
                const val = parseInt(p, 10);
                if (!isNaN(val)) {
                    v.precio = val;
                    window.guardarBD();
                    renderVariantesModal();
                    renderProductos();
                }
            }
        }

        function editarNombreVariante(index) {
            const v = productoActualModal.variantes[index];
            const n = prompt(`Nuevo nombre para el color / variante:`, v.color);
            if (n && n.trim() !== '') {
                v.color = n.trim();
                window.guardarBD();
                renderVariantesModal();
            }
        }

        function eliminarVariante(index) {
            if (confirm(`¿Eliminar este color/variante?`)) {
                productoActualModal.variantes.splice(index, 1);
                window.guardarBD();
                renderVariantesModal();
                renderProductos();
            }
        }

        function agregarNuevoColorVariante() {
            const color = prompt('Nombre del nuevo color/tipo:');
            if (color && color.trim() !== '') {
                const stock = parseInt(prompt('Stock inicial:', '50'), 10) || 0;
                const precio = parseInt(prompt('Precio:', '1200'), 10) || 0;

                productoActualModal.variantes.push({
                    color: color.trim(),
                    stock: stock,
                    precio: precio
                });

                window.guardarBD();
                renderVariantesModal();
                renderProductos();
            }
        }

        function cerrarModalColores() {
            document.getElementById('modal-colores').style.display = 'none';
            productoActualModal = null;
            window.productoActualModal = null;
        }

        // --- 4. CARRITO HOY Y HISTORIAL ---
        function renderCarritoHoy() {
            const cont = document.getElementById('contenedor-carrito-hoy');
            cont.innerHTML = '';

            let nombres = Object.keys(window.datos.carritoHoy || {});
            nombres.sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));

            if (nombres.length === 0) {
                cont.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">No has agregado ventas hoy.</div>';
                return;
            }

            nombres.forEach(nombre => {
                const item = window.datos.carritoHoy[nombre];
                const qty = typeof item === 'object' ? item.cantidad : item;
                const pr = typeof item === 'object' ? item.precio : 0;
                const precioTxt = pr ? ` - $${(pr * qty).toLocaleString('es-CO')}` : '';

                const row = document.createElement('div');
                row.className = 'list-row';
                row.innerHTML = `
                    <div class="prod-name">${nombre} <span style="font-size:0.8rem; color:#0056b3;">${precioTxt}</span></div>
                    <div class="controls">
                        <button class="btn-circle btn-minus" onclick="modificarCantidadCarrito('${nombre}', -1)">-</button>
                        <span>${qty}</span>
                        <button class="btn-circle btn-plus" onclick="modificarCantidadCarrito('${nombre}', 1)">+</button>
                    </div>
                `;
                cont.appendChild(row);
            });
        }

        function modificarCantidadCarrito(nombre, delta) {
            if (window.datos.carritoHoy[nombre]) {
                if (typeof window.datos.carritoHoy[nombre] === 'number') {
                    window.datos.carritoHoy[nombre] = { cantidad: window.datos.carritoHoy[nombre], precio: 0 };
                }
                window.datos.carritoHoy[nombre].cantidad += delta;
                if (window.datos.carritoHoy[nombre].cantidad <= 0) {
                    delete window.datos.carritoHoy[nombre];
                }
                window.guardarBD();
                renderCarritoHoy();
            }
        }

        function renderHistorial() {
            const cont = document.getElementById('contenedor-historial-fechas');
            cont.innerHTML = '';

            if (!window.datos.historialFechas || window.datos.historialFechas.length === 0) {
                cont.innerHTML = '<div style="text-align:center; color:#888; margin-top:20px;">No hay historial guardado.</div>';
                return;
            }

            window.datos.historialFechas.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'list-row';
                row.style.cursor = 'pointer';

                const btnTexto = modos.Hist.eliminar ? '🗑️ BORRAR' : 'VER';
                const btnColor = modos.Hist.eliminar ? '#dc3545' : '#3b82f6';

                row.innerHTML = `
                    <div class="prod-name">📅 ${item.fecha} ${item.hora ? ' - ⏰ ' + item.hora : ''}</div>
                    <button class="nav-btn" style="background:${btnColor}; color:#fff;" onclick="event.stopPropagation(); manejarClickHistorial(${index})">${btnTexto}</button>
                `;
                row.onclick = () => manejarClickHistorial(index);
                cont.appendChild(row);
            });
        }

        function manejarClickHistorial(index) {
            if (modos.Hist.eliminar) {
                const fechaStr = window.datos.historialFechas[index].fecha;
                if (confirm(`¿Eliminar registro completo del día ${fechaStr}?`)) {
                    window.datos.historialFechas.splice(index, 1);
                    window.guardarBD();
                    desactivarTodosModos();
                    renderHistorial();
                }
            } else {
                verDetalleHistorial(index);
            }
        }

        function verDetalleHistorial(index) {
            historialIndexActual = index;
            const item = window.datos.historialFechas[index];
            document.getElementById('modal-titulo-fecha').innerText = `VENTAS: ${item.fecha}`;
            renderListaModalHistorial();
            document.getElementById('modal-historial').style.display = 'flex';
        }

        function renderListaModalHistorial() {
            const contModal = document.getElementById('modal-lista-productos');
            contModal.innerHTML = '';

            const item = window.datos.historialFechas[historialIndexActual];
            let nombres = Object.keys(item.productos || {});
            let totalDia = 0;

            if (nombres.length === 0) {
                contModal.innerHTML = '<div style="color:#aaa; padding:10px;">No hay productos registrados en este día.</div>';
            }

            nombres.forEach(nombre => {
                const val = item.productos[nombre];
                const qty = typeof val === 'object' ? val.cantidad : val;
                const pr = typeof val === 'object' ? val.precio : 0;
                const subtotal = pr * qty;
                totalDia += subtotal;

                const precioTxt = pr ? ` - $${subtotal.toLocaleString('es-CO')}` : '';

                const r = document.createElement('div');
                r.className = 'list-row';
                r.style.marginBottom = '8px';
                r.innerHTML = `
                    <div class="prod-name">${nombre} <span style="font-size:0.8rem; color:#0056b3;">${precioTxt}</span></div>
                    <div class="controls">
                        <button class="btn-circle btn-minus" onclick="modificarCantidadHistorial('${nombre}', -1)">-</button>
                        <span>${qty}</span>
                        <button class="btn-circle btn-plus" onclick="modificarCantidadHistorial('${nombre}', 1)">+</button>
                        <button class="btn-icon" style="background:#dc3545;" onclick="eliminarProductoHistorial('${nombre}')">🗑️</button>
                    </div>
                `;
                contModal.appendChild(r);
            });

            document.getElementById('modal-total-dia').innerText = `TOTAL VENDIDO: $${totalDia.toLocaleString('es-CO')}`;
        }

        function agregarProductoFaltanteHistorial() {
            const nombre = prompt('Nombre del producto:');
            if (nombre && nombre.trim() !== '') {
                const cantidad = parseInt(prompt(`Cantidad:`, '1'), 10);
                if (!isNaN(cantidad) && cantidad > 0) {
                    const precio = parseInt(prompt(`Precio unitario ($):`, '1200'), 10) || 0;
                    const item = window.datos.historialFechas[historialIndexActual];
                    const n = nombre.trim();

                    if (!item.productos) item.productos = {};

                    if (item.productos[n]) {
                        if (typeof item.productos[n] === 'object') {
                            item.productos[n].cantidad += cantidad;
                            if (precio > 0) item.productos[n].precio = precio;
                        } else {
                            item.productos[n] = { cantidad: item.productos[n] + cantidad, precio: precio };
                        }
                    } else {
                        item.productos[n] = { cantidad: cantidad, precio: precio };
                    }

                    window.guardarBD();
                    renderListaModalHistorial();
                }
            }
        }

        function modificarCantidadHistorial(nombreProd, delta) {
            const item = window.datos.historialFechas[historialIndexActual];
            if (item.productos[nombreProd]) {
                if (typeof item.productos[nombreProd] === 'object') {
                    item.productos[nombreProd].cantidad += delta;
                    if (item.productos[nombreProd].cantidad <= 0) delete item.productos[nombreProd];
                } else {
                    item.productos[nombreProd] += delta;
                    if (item.productos[nombreProd] <= 0) delete item.productos[nombreProd];
                }
                window.guardarBD();
                renderListaModalHistorial();
            }
        }

        function eliminarProductoHistorial(nombreProd) {
            const item = window.datos.historialFechas[historialIndexActual];
            delete item.productos[nombreProd];
            window.guardarBD();
            renderListaModalHistorial();
        }

        function cerrarModalHistorial() {
            document.getElementById('modal-historial').style.display = 'none';
            renderHistorial();
        }

        function guardarDiaEnHistorial() {
            if (!window.datos.carritoHoy || Object.keys(window.datos.carritoHoy).length === 0) {
                alert('El carrito está vacío.');
                return;
            }

            if (confirm('¿Guardar el carrito de hoy en el historial?')) {
                const ahora = new Date();
                const horaStr = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

                if (!window.datos.historialFechas) window.datos.historialFechas = [];

                window.datos.historialFechas.unshift({
                    fecha: strFecha,
                    hora: horaStr,
                    productos: JSON.parse(JSON.stringify(window.datos.carritoHoy))
                });

                window.datos.carritoHoy = {};
                window.guardarBD();
                alert('¡Guardado con éxito!');
                verPantalla('pantalla-historial');
            }
        }

        function filtrarCards(contenedorId, texto) {
            const txt = texto.toLowerCase();
            document.querySelectorAll(`#${contenedorId} .card-product`).forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(txt) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
